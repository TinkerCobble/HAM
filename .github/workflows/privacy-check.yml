name: HAM privacy checks

on:
  pull_request:
    branches: [dev, main, 'feature/**']
  push:
    branches: [dev, main, 'feature/**']
  schedule:
    - cron: '37 13 * * 1'
  workflow_dispatch:
    inputs:
      release_gate:
        description: 'Require live public policy and terms pages'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Scan full Git history for secrets
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check privacy-sensitive source and documentation
        run: python scripts/privacy_check.py
      - name: Check live legal pages for weekly or release review
        if: ${{ github.event_name == 'schedule' || inputs.release_gate == true }}
        run: python scripts/privacy_check.py --public
